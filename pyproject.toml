[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwta"
version = "0.1.0"
description = "DeepWTA-Standard graph-neural optimizer for multi-scheme weapon-target assignment"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "opencv-python>=4.8",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
